name: Add operations committee section
on:
  push:
    paths:
      - '.github/workflows/add-operations-committee.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add operations committee
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          anchor='''  </section>\n\n  <!-- ===== 준비 일정 ===== -->'''
          block='''  </section>\n\n  <!-- ===== 운영위원 ===== -->\n  <section id="section-operations-committee">\n    <div class="sec-head">\n      <div class="sec-title">운영위원</div>\n      <div class="sec-head-right">\n        <div class="sec-note">8명 · 세부 역할은 추후 배정</div>\n      </div>\n    </div>\n    <div class="sec-body">\n      <div class="committee-grid">\n        <div class="member-card"><div style="font-size:12.5px;font-weight:700;padding:3px 5px;">김미주</div><div style="font-size:10px;color:var(--ink-mute);padding:0 5px;">7기</div><div class="member-tag" style="display:inline-block;margin:5px;">운영위원</div></div>\n        <div class="member-card"><div style="font-size:12.5px;font-weight:700;padding:3px 5px;">정지원</div><div style="font-size:10px;color:var(--ink-mute);padding:0 5px;">9기</div><div class="member-tag" style="display:inline-block;margin:5px;">운영위원</div></div>\n        <div class="member-card"><div style="font-size:12.5px;font-weight:700;padding:3px 5px;">김동욱</div><div style="font-size:10px;color:var(--ink-mute);padding:0 5px;">10기</div><div class="member-tag" style="display:inline-block;margin:5px;">운영위원</div></div>\n        <div class="member-card"><div style="font-size:12.5px;font-weight:700;padding:3px 5px;">이해리</div><div style="font-size:10px;color:var(--ink-mute);padding:0 5px;">11기</div><div class="member-tag" style="display:inline-block;margin:5px;">운영위원</div></div>\n        <div class="member-card"><div style="font-size:12.5px;font-weight:700;padding:3px 5px;">조재영</div><div style="font-size:10px;color:var(--ink-mute);padding:0 5px;">22기</div><div class="member-tag" style="display:inline-block;margin:5px;">운영위원</div></div>\n        <div class="member-card"><div style="font-size:12.5px;font-weight:700;padding:3px 5px;">윤여창</div><div style="font-size:10px;color:var(--ink-mute);padding:0 5px;">23기</div><div class="member-tag" style="display:inline-block;margin:5px;">운영위원</div></div>\n        <div class="member-card"><div style="font-size:12.5px;font-weight:700;padding:3px 5px;">권능</div><div style="font-size:10px;color:var(--ink-mute);padding:0 5px;">23기</div><div class="member-tag" style="display:inline-block;margin:5px;">운영위원</div></div>\n        <div class="member-card"><div style="font-size:12.5px;font-weight:700;padding:3px 5px;">송유진</div><div style="font-size:10px;color:var(--ink-mute);padding:0 5px;">25기</div><div class="member-tag" style="display:inline-block;margin:5px;">운영위원</div></div>\n      </div>\n    </div>\n  </section>\n\n  <!-- ===== 준비 일정 ===== -->'''
          if 'id="section-operations-committee"' not in s:
              if anchor not in s:
                  raise SystemExit('anchor not found')
              s=s.replace(anchor,block,1)
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Add operations committee below prep committee'
          git push
