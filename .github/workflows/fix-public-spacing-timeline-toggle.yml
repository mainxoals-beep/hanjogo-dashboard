name: Fix public spacing and timeline toggle

on:
  push:
    paths:
      - '.github/workflows/fix-public-spacing-timeline-toggle.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch schedule.html
        shell: python
        run: |
          from pathlib import Path
          p=Path('schedule.html')
          s=p.read_text(encoding='utf-8')

          css_anchor='.faq-item.open .faq-a{display:block}'
          css_add='''.faq-item.open .faq-a{display:block}\n.faq-section{margin-bottom:32px}\n.collapsible-sec-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}\n.collapsible-sec-head .sec-title{margin-bottom:0}\n.timeline-toggle{border:none;background:transparent;color:var(--purple-dark);font-size:16px;font-weight:900;padding:4px 7px;border-radius:8px}\n.timeline-toggle:hover{background:var(--purple-light)}\n.timeline-wrap[hidden]{display:none}'''
          if '.faq-section{margin-bottom:32px}' not in s:
              if css_anchor not in s: raise SystemExit('css anchor not found')
              s=s.replace(css_anchor,css_add,1)

          old_faq='''<div class="section">\n<div class="sec-title">자주 묻는 질문</div>\n<div class="faq" id="faqList"></div>\n</div>'''
          new_faq='''<div class="section faq-section">\n<div class="sec-title">자주 묻는 질문</div>\n<div class="faq" id="faqList"></div>\n</div>'''
          if old_faq in s:
              s=s.replace(old_faq,new_faq,1)

          old_timeline='''<div class="section">\n<div class="sec-title">한눈에 보는 일정</div>\n<div class="timeline" id="timeline"></div>\n</div>'''
          new_timeline='''<div class="section" id="timelineSection">\n<div class="collapsible-sec-head">\n<div class="sec-title">한눈에 보는 일정</div>\n<button class="timeline-toggle" id="timelineToggle" type="button" aria-expanded="false" aria-controls="timelineWrap" title="일정 펼치기">▾</button>\n</div>\n<div class="timeline-wrap" id="timelineWrap" hidden>\n<div class="timeline" id="timeline"></div>\n</div>\n</div>'''
          if old_timeline in s:
              s=s.replace(old_timeline,new_timeline,1)
          elif 'id="timelineToggle"' not in s:
              raise SystemExit('timeline anchor not found')

          js_anchor='''loadPublicInfo();\n\nrecordAndShowVisit();'''
          js_new='''const timelineToggle=document.getElementById("timelineToggle");\nconst timelineWrap=document.getElementById("timelineWrap");\nif(timelineToggle && timelineWrap){\n  timelineToggle.addEventListener("click",()=>{\n    const open=timelineToggle.getAttribute("aria-expanded")==="true";\n    const next=!open;\n    timelineToggle.setAttribute("aria-expanded",next?"true":"false");\n    timelineToggle.textContent=next?"▴":"▾";\n    timelineToggle.title=next?"일정 접기":"일정 펼치기";\n    timelineWrap.hidden=!next;\n  });\n}\n\nloadPublicInfo();\n\nrecordAndShowVisit();'''
          if 'timelineToggle.addEventListener' not in s:
              if js_anchor not in s: raise SystemExit('js anchor not found')
              s=s.replace(js_anchor,js_new,1)

          p.write_text(s,encoding='utf-8')

      - name: Commit changes and remove workflow
        run: |
          rm .github/workflows/fix-public-spacing-timeline-toggle.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add schedule.html .github/workflows/fix-public-spacing-timeline-toggle.yml
          git commit -m "fix: space FAQ and collapse public timeline"
          git push
