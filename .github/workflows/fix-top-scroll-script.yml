name: Fix top scrollbar script execution

on:
  push:
    paths:
      - '.github/workflows/fix-top-scroll-script.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix script tag
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          t=p.read_text(encoding='utf-8')
          old='''  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">\nfunction syncTopScroll'''
          new='''  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>\n  <script>\nfunction syncTopScroll'''
          if old not in t:
              raise SystemExit('target script pattern not found')
          t=t.replace(old,new,1)
          p.write_text(t,encoding='utf-8')
          PY
      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Fix top scrollbar script execution"
          git push
