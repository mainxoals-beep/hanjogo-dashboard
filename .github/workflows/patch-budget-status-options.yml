name: Patch budget status options
on:
  push:
    paths:
      - '.github/workflows/patch-budget-status-options.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index.html
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='return ["예정","견적중","확정","일부결제","완료"].map(v=>`<option ${v===selected?"selected":""}>${v}</option>`).join("");'
          new='return ["가정","예정","거의 확정","견적중","확정","일부결제","완료"].map(v=>`<option ${v===selected?"selected":""}>${v}</option>`).join("");'
          if old not in s:
              raise SystemExit('target not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
      - name: Commit patch and cleanup workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/patch-budget-status-options.yml
          git add index.html .github/workflows/patch-budget-status-options.yml
          git commit -m "fix: support budget planning statuses"
          git push
