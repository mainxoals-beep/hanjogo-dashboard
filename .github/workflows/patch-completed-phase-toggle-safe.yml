name: Patch safe completed phase toggle

on:
  push:
    paths:
      - '.github/workflows/patch-completed-phase-toggle-safe.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index.html safely
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          anchor='''function renderPhases(){\n  const list = document.getElementById("phaseList");\n  list.innerHTML = "";\n  let doneCount = 0;\n  const sorted = [...state.phases].sort((a,b) => (a.start||"").localeCompare(b.start||""));\n  sorted.forEach(p => {\n    const done = !!state.phaseStatus[p.id];\n    if(done) doneCount++;'''
          repl='''function getHideCompletedPhases(){\n  try{return localStorage.getItem("hanjogo_hide_completed_phases") !== "false";}catch(e){return true;}\n}\nfunction setHideCompletedPhases(value){\n  try{localStorage.setItem("hanjogo_hide_completed_phases", String(value));}catch(e){}\n  renderPhases();\n}\nfunction ensureCompletedPhaseToggle(doneCount){\n  const list=document.getElementById("phaseList");\n  const head=list?.closest("section")?.querySelector(".sec-head");\n  if(!head) return;\n  let btn=document.getElementById("completedPhaseToggle");\n  if(!btn){\n    btn=document.createElement("button");\n    btn.type="button";\n    btn.id="completedPhaseToggle";\n    btn.className="collapse-btn";\n    btn.addEventListener("click",()=>setHideCompletedPhases(!getHideCompletedPhases()));\n    const right=head.querySelector(".sec-head-right");\n    if(right) right.prepend(btn); else head.appendChild(btn);\n  }\n  const hidden=getHideCompletedPhases();\n  btn.textContent=hidden ? `완료 항목 펼치기 (${doneCount})` : `완료 항목 접기 (${doneCount})`;\n  btn.style.display=doneCount ? "flex" : "none";\n}\n\nfunction renderPhases(){\n  const list = document.getElementById("phaseList");\n  list.innerHTML = "";\n  let doneCount = 0;\n  const hideCompleted = getHideCompletedPhases();\n  const sorted = [...state.phases].sort((a,b) => (a.start||"").localeCompare(b.start||""));\n  sorted.forEach(p => {\n    const done = !!state.phaseStatus[p.id];\n    if(done) doneCount++;\n    if(done && hideCompleted) return;'''
          if anchor not in s: raise SystemExit('renderPhases anchor not found')
          s=s.replace(anchor,repl,1)

          tail='''  document.getElementById("phaseProgLabel").textContent = `${doneCount} / ${state.phases.length}`;\n  document.getElementById("phaseProgBar").style.width = (state.phases.length ? doneCount/state.phases.length*100 : 0) + "%";\n  applyEditLock();\n}'''
          tail_repl='''  document.getElementById("phaseProgLabel").textContent = `${doneCount} / ${state.phases.length}`;\n  document.getElementById("phaseProgBar").style.width = (state.phases.length ? doneCount/state.phases.length*100 : 0) + "%";\n  ensureCompletedPhaseToggle(doneCount);\n  applyEditLock();\n}'''
          if tail not in s: raise SystemExit('renderPhases tail not found')
          s=s.replace(tail,tail_repl,1)
          p.write_text(s,encoding='utf-8')
      - name: Commit and clean workflow
        run: |
          rm .github/workflows/patch-completed-phase-toggle-safe.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/patch-completed-phase-toggle-safe.yml
          git commit -m "feat: safely collapse completed preparation items"
          git push
