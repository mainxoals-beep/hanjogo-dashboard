name: Add top table scrollbars

on:
  push:
    paths:
      - '.github/workflows/patch-dashboard-ui.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch index.html
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          original = text

          # CSS for upper horizontal scrollbar
          css_marker = '  /* sponsor table readability */'
          css = '''  /* synced top horizontal scrollbars for wide tables */\n  .top-hscroll{overflow-x:auto;overflow-y:hidden;height:16px;margin:2px 0 6px;}\n  .top-hscroll-inner{height:1px;}\n  .top-hscroll::-webkit-scrollbar{height:10px;}\n  .top-hscroll::-webkit-scrollbar-thumb{background:#CFC9BE;border-radius:999px;}\n  .top-hscroll::-webkit-scrollbar-track{background:#F1EFE8;border-radius:999px;}\n\n'''
          if css.strip() not in text:
              text = text.replace(css_marker, css + css_marker)

          # Give existing sponsor scroll wrapper an id and add top scrollbar above it
          old_sponsor = '''        <div style="overflow-x:auto;">\n        <table class="to-cards" id="sponsorTable">'''
          new_sponsor = '''        <div class="top-hscroll" data-sync-scroll="sponsorScroll"><div class="top-hscroll-inner"></div></div>\n        <div style="overflow-x:auto;" id="sponsorScroll">\n        <table class="to-cards" id="sponsorTable">'''
          if old_sponsor in text:
              text = text.replace(old_sponsor, new_sponsor, 1)

          # Budget table top scrollbar
          old_budget = '''        <div class="budget-table-wrap">\n          <table class="budget-table">'''
          new_budget = '''        <div class="top-hscroll" data-sync-scroll="budgetScroll"><div class="top-hscroll-inner"></div></div>\n        <div class="budget-table-wrap" id="budgetScroll">\n          <table class="budget-table">'''
          if old_budget in text:
              text = text.replace(old_budget, new_budget, 1)

          # JS: synchronize the upper and lower scrollbars and keep width current
          js_marker = '// ---------- render all / init ----------'
          js = r'''
// ---------- synced top horizontal scrollbars ----------
function setupTopHorizontalScrollbars(){
  document.querySelectorAll('.top-hscroll[data-sync-scroll]').forEach(top => {
    const target = document.getElementById(top.dataset.syncScroll);
    const inner = top.querySelector('.top-hscroll-inner');
    if(!target || !inner || top.dataset.bound === '1') return;

    const refresh = () => {
      const width = Math.max(target.scrollWidth, target.clientWidth);
      inner.style.width = width + 'px';
      top.style.display = target.scrollWidth > target.clientWidth + 2 ? 'block' : 'none';
      top.scrollLeft = target.scrollLeft;
    };

    let syncing = false;
    top.addEventListener('scroll', () => {
      if(syncing) return;
      syncing = true;
      target.scrollLeft = top.scrollLeft;
      requestAnimationFrame(() => syncing = false);
    });
    target.addEventListener('scroll', () => {
      if(syncing) return;
      syncing = true;
      top.scrollLeft = target.scrollLeft;
      requestAnimationFrame(() => syncing = false);
    });

    if(window.ResizeObserver){
      const ro = new ResizeObserver(refresh);
      ro.observe(target);
      const table = target.querySelector('table');
      if(table) ro.observe(table);
    }
    window.addEventListener('resize', refresh);
    top.dataset.bound = '1';
    refresh();
  });
}

'''
          if 'function setupTopHorizontalScrollbars()' not in text:
              text = text.replace(js_marker, js + js_marker)

          # call after initial render and after any full rerender
          text = text.replace(
              '  renderParticipantPayments();\n  applyEditLock();\n}',
              '  renderParticipantPayments();\n  applyEditLock();\n  requestAnimationFrame(setupTopHorizontalScrollbars);\n}',
              1
          )
          text = text.replace(
              '  renderAll();\n  loadVisitorStats();',
              '  renderAll();\n  requestAnimationFrame(setupTopHorizontalScrollbars);\n  loadVisitorStats();',
              1
          )

          if text == original:
              raise SystemExit('No changes were applied')

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Add synced top scrollbars for sponsor and budget tables"
          git push
