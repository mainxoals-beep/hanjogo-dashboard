name: Patch sponsor note readability

on:
  push:
    paths:
      - '.github/workflows/patch-dashboard-ui.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch index.html
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          original = text

          # 협찬표를 넓혀 비고와 이미지가 답답하지 않게 표시
          marker = '  /* mobile card-style rows for sponsors/production/waitlist */'
          css = '''  /* sponsor table readability */\n  #sponsorTable{min-width:1380px;table-layout:fixed;}\n  #sponsorTable th:nth-child(1),#sponsorTable td:nth-child(1){width:180px;}\n  #sponsorTable th:nth-child(2),#sponsorTable td:nth-child(2){width:190px;}\n  #sponsorTable th:nth-child(3),#sponsorTable td:nth-child(3){width:105px;}\n  #sponsorTable th:nth-child(4),#sponsorTable td:nth-child(4){width:105px;}\n  #sponsorTable th:nth-child(5),#sponsorTable td:nth-child(5){width:125px;}\n  #sponsorTable th:nth-child(6),#sponsorTable td:nth-child(6){width:190px;}\n  #sponsorTable th:nth-child(7),#sponsorTable td:nth-child(7){width:280px;}\n  #sponsorTable th:nth-child(8),#sponsorTable td:nth-child(8){width:180px;}\n  #sponsorTable th:nth-child(9),#sponsorTable td:nth-child(9){width:42px;}\n  #sponsorTable td{vertical-align:top;}\n  #sponsorTable textarea{\n    width:100%;min-height:76px;resize:vertical;border:1px solid var(--line);border-radius:8px;\n    padding:7px 8px;background:#FDFCFB;color:var(--ink);font:inherit;font-size:12.5px;line-height:1.5;\n    white-space:pre-wrap;word-break:break-word;\n  }\n  #sponsorTable textarea:focus{outline:none;background:#fff;border-color:var(--purple);}\n\n'''
          if css.strip() not in text:
              text = text.replace(marker, css + marker)

          # 협찬 비고를 한 줄 input -> 여러 줄 textarea로 변경
          old = '<td data-label="비고"><input type="text" value="${escapeHtml(row.note)}" data-field="note"></td>'
          new = '<td data-label="비고"><textarea data-field="note" placeholder="협찬 조건·수량·배송 등 메모">${escapeHtml(row.note||"")}</textarea></td>'
          if old in text:
              text = text.replace(old, new, 1)

          # textarea도 저장 이벤트 및 보기모드 잠금 대상에 포함
          text = text.replace(
              'tr.querySelectorAll("input[data-field],select[data-field]").forEach(el => {',
              'tr.querySelectorAll("input[data-field],select[data-field],textarea[data-field]").forEach(el => {',
              1
          )
          text = text.replace(
              '#sponsorBody input, #sponsorBody select, #sponsorBody button,',
              '#sponsorBody input, #sponsorBody select, #sponsorBody textarea, #sponsorBody button,'
          )

          if text == original:
              raise SystemExit('No changes were applied')

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Improve sponsor note readability"
          git push
