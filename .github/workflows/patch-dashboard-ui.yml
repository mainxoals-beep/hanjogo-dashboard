name: Compact sponsor image attachments

on:
  push:
    paths:
      - '.github/workflows/patch-dashboard-ui.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch index.html
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          original = text

          # Compact sponsor attachment UI
          css_marker = '  /* sponsor table readability */'
          css = '''  /* compact sponsor attachment UI */\n  .sponsor-file-compact{display:flex;flex-direction:column;gap:5px;min-width:145px;}\n  .sponsor-file-name{font-size:10.5px;font-weight:700;color:var(--ink-sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:155px;}\n  .sponsor-file-actions{display:flex;gap:4px;flex-wrap:wrap;}\n  .sponsor-file-actions .mini-btn{padding:5px 7px;font-size:10px;}\n\n'''
          if css.strip() not in text:
              text = text.replace(css_marker, css + css_marker)

          start = text.find('// ---------- sponsors ----------')
          end = text.find('// ---------- production ----------', start)
          if start == -1 or end == -1:
              raise SystemExit('Sponsor render block not found')
          block = text[start:end]

          old = '''      <td data-label="이미지">\n        <div class="prod-image-wrap">\n          ${row.image ? `<img class="prod-thumb sponsor-thumb" src="${row.image}" alt="협찬 이미지">` : `<div class="prod-image-placeholder">이미지 없음</div>`}\n          <div class="prod-image-actions">\n            <button type="button" class="mini-btn sponsor-upload lockable">이미지 첨부</button>\n            ${row.image ? `<button type="button" class="mini-btn danger sponsor-remove lockable">삭제</button>` : ""}\n            <input type="file" class="sponsor-file" accept="image/*" style="display:none;">\n          </div>\n        </div>\n      </td>'''
          new = '''      <td data-label="이미지">\n        <div class="sponsor-file-compact">\n          ${row.image ? `<div class="sponsor-file-name" title="${escapeHtml(row.imageName||\"첨부 이미지\")}">${escapeHtml(row.imageName||\"첨부 이미지\")}</div>` : ""}\n          <div class="sponsor-file-actions">\n            <button type="button" class="mini-btn sponsor-upload lockable">${row.image ? "교체" : "이미지 첨부"}</button>\n            ${row.image ? `<button type="button" class="mini-btn sponsor-preview">미리보기</button><button type="button" class="mini-btn sponsor-download">다운로드</button><button type="button" class="mini-btn danger sponsor-remove lockable">삭제</button>` : ""}\n            <input type="file" class="sponsor-file" accept="image/*" style="display:none;">\n          </div>\n        </div>\n      </td>'''
          if old not in block:
              raise SystemExit('Sponsor image UI block not found')
          block = block.replace(old, new, 1)

          # Update handler declarations
          block = block.replace(
              '    const sponsorThumb = tr.querySelector(".sponsor-thumb");',
              '    const sponsorPreview = tr.querySelector(".sponsor-preview");\n    const sponsorDownload = tr.querySelector(".sponsor-download");'
          )

          # Save original file name alongside compressed image
          block = block.replace(
              '          row.image = await compressImageFile(file, 1000, .72);\n          await dSet("sponsors", state.sponsors);',
              '          row.image = await compressImageFile(file, 1000, .72);\n          row.imageName = file.name || "협찬 이미지";\n          await dSet("sponsors", state.sponsors);'
          )

          # Clear filename on removal
          block = block.replace(
              '        row.image = "";\n        await dSet("sponsors", state.sponsors);',
              '        row.image = "";\n        row.imageName = "";\n        await dSet("sponsors", state.sponsors);'
          )

          old_preview_handler = '''    if(sponsorThumb){\n      sponsorThumb.addEventListener("click", () => openProductionImage(row.image));\n    }\n'''
          new_preview_handler = '''    if(sponsorPreview){\n      sponsorPreview.addEventListener("click", () => openProductionImage(row.image));\n    }\n    if(sponsorDownload){\n      sponsorDownload.addEventListener("click", () => {\n        if(!row.image) return;\n        const a = document.createElement("a");\n        a.href = row.image;\n        a.download = row.imageName || "sponsor-image.jpg";\n        document.body.appendChild(a);\n        a.click();\n        a.remove();\n      });\n    }\n'''
          if old_preview_handler in block:
              block = block.replace(old_preview_handler, new_preview_handler, 1)
          else:
              raise SystemExit('Sponsor preview handler not found')

          # New sponsor rows carry filename field too
          block = block.replace(
              'state.sponsors.push({id:uid(), name:"", item:"", status:"컨택전", note:"", owner:"", lastContact:"", nextAction:"", image:""});',
              'state.sponsors.push({id:uid(), name:"", item:"", status:"컨택전", note:"", owner:"", lastContact:"", nextAction:"", image:"", imageName:""});'
          )

          text = text[:start] + block + text[end:]

          # Migrate existing sponsor data
          text = text.replace(
              '    if(s.image === undefined) s.image = "";\n',
              '    if(s.image === undefined) s.image = "";\n    if(s.imageName === undefined) s.imageName = "";\n'
          )

          if text == original:
              raise SystemExit('No changes were applied')

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Compact sponsor image attachments and add download"
          git push
