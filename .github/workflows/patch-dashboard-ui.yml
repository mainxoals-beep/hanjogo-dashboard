name: Compact budget rows and top scrollbars

on:
  push:
    paths:
      - '.github/workflows/patch-dashboard-ui.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch index.html
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          original = text

          # Compact budget note area: one line by default, expands only when content needs it.
          css = '''
  /* compact budget rows + synced top horizontal scrollbar */
  .budget-table textarea.budget-note-input{
    min-height:36px !important;
    height:36px;
    line-height:1.4;
    resize:vertical;
    overflow:hidden;
  }
  .top-hscroll{
    overflow-x:auto;
    overflow-y:hidden;
    height:15px;
    margin:2px 0 6px;
  }
  .top-hscroll-inner{height:1px;}
  .top-hscroll::-webkit-scrollbar{height:10px;}
  .top-hscroll::-webkit-scrollbar-thumb{background:#CFC9BE;border-radius:999px;}
  .top-hscroll::-webkit-scrollbar-track{background:#F1EFE8;border-radius:999px;}
'''
          if '/* compact budget rows + synced top horizontal scrollbar */' not in text:
              text = text.replace('</style>', css + '\n</style>', 1)

          js = r'''

// ---------- reliable top scrollbars + compact budget note height ----------
function resizeBudgetNotes(){
  document.querySelectorAll('.budget-note-input').forEach(el => {
    el.style.height = '36px';
    el.style.height = Math.max(36, el.scrollHeight) + 'px';
  });
}

function ensureTopScrollbar(target, key){
  if(!target) return;
  let top = document.querySelector(`.top-hscroll[data-scroll-key="${key}"]`);
  if(!top){
    top = document.createElement('div');
    top.className = 'top-hscroll';
    top.dataset.scrollKey = key;
    top.innerHTML = '<div class="top-hscroll-inner"></div>';
    target.parentNode.insertBefore(top, target);
  }
  const inner = top.querySelector('.top-hscroll-inner');
  const refresh = () => {
    inner.style.width = Math.max(target.scrollWidth, target.clientWidth) + 'px';
    top.style.display = target.scrollWidth > target.clientWidth + 2 ? 'block' : 'none';
    if(Math.abs(top.scrollLeft - target.scrollLeft) > 1) top.scrollLeft = target.scrollLeft;
  };
  if(top.dataset.bound !== '1'){
    let busy = false;
    top.addEventListener('scroll', () => {
      if(busy) return;
      busy = true;
      target.scrollLeft = top.scrollLeft;
      requestAnimationFrame(() => busy = false);
    });
    target.addEventListener('scroll', () => {
      if(busy) return;
      busy = true;
      top.scrollLeft = target.scrollLeft;
      requestAnimationFrame(() => busy = false);
    });
    top.dataset.bound = '1';
  }
  refresh();
}

function setupReliableTableUi(){
  const sponsorTable = document.getElementById('sponsorTable');
  const sponsorWrap = sponsorTable ? sponsorTable.parentElement : null;
  ensureTopScrollbar(sponsorWrap, 'sponsor');

  const budgetTable = document.querySelector('.budget-table');
  const budgetWrap = budgetTable ? budgetTable.closest('.budget-table-wrap') : null;
  ensureTopScrollbar(budgetWrap, 'budget');

  resizeBudgetNotes();
}

window.addEventListener('resize', setupReliableTableUi);
setTimeout(setupReliableTableUi, 0);
setTimeout(setupReliableTableUi, 500);

const _budgetUiObserver = new MutationObserver(() => {
  requestAnimationFrame(setupReliableTableUi);
});
const _budgetBodyWatch = document.getElementById('budgetBody');
const _sponsorBodyWatch = document.getElementById('sponsorBody');
if(_budgetBodyWatch) _budgetUiObserver.observe(_budgetBodyWatch, {childList:true, subtree:true});
if(_sponsorBodyWatch) _budgetUiObserver.observe(_sponsorBodyWatch, {childList:true, subtree:true});

document.addEventListener('input', e => {
  if(e.target && e.target.classList && e.target.classList.contains('budget-note-input')){
    e.target.style.height = '36px';
    e.target.style.height = Math.max(36, e.target.scrollHeight) + 'px';
  }
});
'''
          if '// ---------- reliable top scrollbars + compact budget note height ----------' not in text:
              text = text.replace('</script>', js + '\n</script>', 1)

          if text == original:
              raise SystemExit('No changes were applied')

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Compact budget rows and add reliable top scrollbars"
          git push
