name: Patch public FAQ position

on:
  push:
    paths:
      - '.github/workflows/patch-public-faq-position.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch schedule.html
        shell: python
        run: |
          from pathlib import Path
          p=Path('schedule.html')
          s=p.read_text(encoding='utf-8')

          duplicate='''<p class="recruitment-note">※ 2차 참가신청은 9월 14일(월) 오후 2시부터 9월 19일(토) 23:59까지 진행됩니다.</p>\n'''
          if duplicate not in s:
              raise SystemExit('duplicate note not found')
          s=s.replace(duplicate,'',1)

          faq='''<div class="section">\n<div class="sec-title">자주 묻는 질문</div>\n<div class="faq" id="faqList"></div>\n</div>\n\n'''
          if s.count(faq)!=1:
              raise SystemExit(f'faq block count unexpected: {s.count(faq)}')
          s=s.replace(faq,'',1)

          anchor='''<div class="alumni-card">\n<div class="alumni-head">'''
          if anchor not in s:
              raise SystemExit('alumni anchor not found')
          s=s.replace(anchor, faq + anchor,1)

          p.write_text(s,encoding='utf-8')
      - name: Commit and clean workflow
        run: |
          rm .github/workflows/patch-public-faq-position.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add schedule.html .github/workflows/patch-public-faq-position.yml
          git commit -m "fix: clean public application note and move FAQ"
          git push
