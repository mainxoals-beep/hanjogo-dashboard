name: Patch second application schedule

on:
  push:
    paths:
      - '.github/workflows/patch-second-application.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update schedule.html
        shell: python
        run: |
          from pathlib import Path

          path = Path('schedule.html')
          s = path.read_text(encoding='utf-8')

          replacements = {
            '<div class="application-cta-title">1차 참가신청</div>': '<div class="application-cta-title">2차 참가신청</div>',
            '<div class="recruitment-target" id="recruitmentTarget">1차 모집 목표 80명</div>': '<div class="recruitment-target" id="recruitmentTarget">2차 참가신청 · 9월 19일(토) 23:59 마감</div>',
            '<p class="recruitment-note">※ 2차 모집은 1차 신청 및 참가 확정 현황에 따라 안내드립니다.</p>': '<p class="recruitment-note">※ 2차 참가신청은 9월 14일(월) 오후 2시부터 9월 19일(토) 23:59까지 진행됩니다.</p>',
            'const PUBLIC_BUILD_VERSION="2026-08-31-application-lock-fix-v1";': 'const PUBLIC_BUILD_VERSION="2026-09-09-second-application-v1";',
            'title="build 2026-08-31-application-lock-fix-v1"': 'title="build 2026-09-09-second-application-v1"',
            'entryTime:"18:30",': 'entryTime:"18:50",',
            'a:"참가비는 1인 100,000원(십만원)입니다. 대관, 음식·음료 및 행사 운영 비용 등에 사용됩니다."': 'a:"참가비는 1인 80,000원(팔만원)입니다. 여러 동문과 업체의 협찬·후원 덕분에 기존 10만원에서 8만원으로 인하했습니다. 참가비는 대관, 음식·음료 및 행사 운영 비용 등에 사용됩니다."',
            'formUrl:"",\n\nopenAt:"2026-09-02T10:00",\n\ncloseAt:"2026-09-06T23:59",\n\nbeforeLabel:"1차 참가신청 · 9월 2일 오전 10시 오픈 예정",\n\nopenLabel:"1차 참가신청 하기",\n\nclosedLabel:"1차 참가신청 마감"': 'formUrl:"https://forms.gle/ayrigW2hSvhubo1VA",\n\nopenAt:"2026-09-14T14:00",\n\ncloseAt:"2026-09-19T23:59",\n\nbeforeLabel:"2차 참가신청 · 9월 14일 오후 2시 오픈 예정",\n\nopenLabel:"2차 참가신청 하기",\n\nclosedLabel:"2차 참가신청 마감"',
            'start:"2026-09-14",\nend:"2026-09-20",\ntitle:"2차 참가 신청",\ndesc:"1차 모집 이후 잔여 인원을 대상으로 추가 신청을 받습니다.",': 'start:"2026-09-14",\nend:"2026-09-19",\ntitle:"2차 참가 신청",\ndesc:"9월 14일(월) 오후 2시부터 9월 19일(토) 23:59까지 추가 신청을 받습니다.",',
            '<div class="r-v">참가 신청하기 · 9월 6일 23:59 마감</div>': '<div class="r-v">2차 참가신청 하기 · 9월 19일 23:59 마감</div>',
            '1차 참가신청 마감\n<span class="ready-badge">마감</span>': '2차 참가신청 마감\n<span class="ready-badge">마감</span>',
            '9월 2일 오전 10시 오픈 · 9월 6일 23:59 마감\n<span class="ready-badge">준비 중</span>': '9월 14일 오후 2시 오픈 · 9월 19일 23:59 마감\n<span class="ready-badge">준비 중</span>',
            '"9월 2일 오전 10시 1차 참가 신청 오픈"': '"9월 14일 오후 2시 2차 참가 신청 오픈"',
            '"신청 마감은 9월 6일 23:59입니다."': '"신청 마감은 9월 19일(토) 23:59입니다."',
            '"9월 2일 오전 10시에 자동으로 열립니다 · 9월 6일 23:59 마감"': '"9월 14일 오후 2시에 자동으로 열립니다 · 9월 19일(토) 23:59 마감"',
            '"1차 참가신청이 마감되었습니다"': '"2차 참가신청이 마감되었습니다"',
            '"추가 모집 여부는 참가 현황을 확인한 후 안내드리겠습니다."': '"2차 참가신청이 마감되었습니다. 최종 참가자 확정 안내를 확인해 주세요."',
            '"1차 마감"': '"2차 마감"',
            '"1차 참가 신청 진행 중"': '"2차 참가 신청 진행 중"',
            '"9월 6일 23:59 마감"': '"9월 19일(토) 23:59 마감"',
            'function formatRecruitmentTarget(total){\nif(!Number.isFinite(total)||total<0)return "1차 모집 목표 80명";\nreturn total>=80\n? "1차 모집 목표 80명 달성"\n: "1차 모집 목표 80명까지 "+(80-total).toLocaleString()+"명";\n}': 'function formatRecruitmentTarget(total){\nreturn "2차 참가신청 · 9월 19일(토) 23:59 마감";\n}'
          }

          missing=[]
          for old,new in replacements.items():
              if old not in s:
                  missing.append(old[:90].replace('\n','\\n'))
              s=s.replace(old,new)

          if missing:
              raise SystemExit('Expected text not found: ' + ' | '.join(missing))

          path.write_text(s,encoding='utf-8')
      - name: Commit patch and remove temporary workflow
        run: |
          rm .github/workflows/patch-second-application.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add schedule.html .github/workflows/patch-second-application.yml
          git commit -m "fix: update public dashboard for second application"
          git push
