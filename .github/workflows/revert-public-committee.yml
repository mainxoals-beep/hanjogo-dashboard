name: Revert public committee display
on:
  push:
    paths:
      - '.github/workflows/revert-public-committee.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Revert public committee area
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('schedule.html')
          s=p.read_text(encoding='utf-8')
          old='''<div class="info-actions">
<a class="link-btn primary" id="contactTelBtn">문자하기</a>
<a class="link-btn" id="contactMailBtn">이메일 보내기</a>
</div>

</div>
</div>

<div class="committee-card">
  <div class="committee-card-title">함께 준비하는 동문</div>
  <div class="committee-row">
    <div class="committee-row-label">준비위원</div>
    <div class="committee-row-list">박혜림 7기 · 안지현 9기 · 이민주 10기 · 이예린 18기 · 주보근 20기</div>
  </div>
  <div class="committee-row">
    <div class="committee-row-label">운영위원</div>
    <div class="committee-row-list">김미주 7기 · 정지원 9기 · 김동욱 10기 · 이해리 11기 · 조재영 22기 · 윤여창 23기 · 권능 23기 · 송유진 25기</div>
  </div>
</div>
'''
          new='''<div class="info-actions">
<a class="link-btn primary" id="contactTelBtn">문자하기</a>
<a class="link-btn" id="contactMailBtn">이메일 보내기</a>
</div>

<div class="committee-in-contact">
<div class="committee-in-contact-label">준비위원</div>
<div class="committee-in-contact-list">
<span>박혜림 7기</span>
<span>안지현 9기</span>
<span>이민주 10기</span>
<span>이예린 18기</span>
<span>주보근 20기</span>
</div>
</div>

</div>
</div>
'''
          if old not in s:
              raise SystemExit('target block not found')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add schedule.html
          git commit -m "Revert public committee display" || exit 0
          git push
