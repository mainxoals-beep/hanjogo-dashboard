name: Split donations section
on:
  push:
    paths:
      - '.github/workflows/split-donations-section.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch internal dashboard
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          # 1) CSS
          anchor='''  #sponsorTable textarea:focus{outline:none;background:#fff;border-color:var(--purple);}\n'''
          css='''  #sponsorTable textarea:focus{outline:none;background:#fff;border-color:var(--purple);}\n\n  /* cash donations */\n  #donationTable{min-width:760px;table-layout:fixed;}\n  #donationTable th:nth-child(1),#donationTable td:nth-child(1){width:150px;}\n  #donationTable th:nth-child(2),#donationTable td:nth-child(2){width:80px;}\n  #donationTable th:nth-child(3),#donationTable td:nth-child(3){width:130px;}\n  #donationTable th:nth-child(4),#donationTable td:nth-child(4){width:120px;}\n  #donationTable th:nth-child(5),#donationTable td:nth-child(5){width:120px;}\n  #donationTable th:nth-child(6),#donationTable td:nth-child(6){width:260px;}\n  .donation-summary{display:flex;gap:8px;flex-wrap:wrap;padding:12px;border-bottom:1px solid var(--line);}\n  .donation-stat{min-width:130px;padding:8px 10px;border:1px solid var(--line);border-radius:9px;background:#fdfcfa;}\n  .donation-stat .k{font-size:10.5px;color:var(--ink-mute);}\n  .donation-stat .v{margin-top:2px;font-size:15px;font-weight:700;}\n'''
          if anchor in s and '/* cash donations */' not in s:
              s=s.replace(anchor,css,1)

          # 2) HTML section after sponsor section
          marker='''  <!-- ===== 제작물 진행 상황 ===== -->'''
          donation_html='''  <!-- ===== 후원 진행 상황 ===== -->\n  <section>\n    <div class="sec-head">\n      <div class="sec-title">후원 진행 상황</div>\n      <div class="sec-head-right">\n        <div class="sec-note">현금 후원만 별도로 관리합니다</div>\n        <button class="collapse-btn" data-target="body-donations"><span class="chevron">▾</span><span class="collapse-label">펼치기</span></button>\n      </div>\n    </div>\n    <div class="sec-body" id="body-donations">\n      <div class="card">\n        <div class="donation-summary">\n          <div class="donation-stat"><div class="k">후원 예정·확정</div><div class="v" id="donationExpectedTotal">0원</div></div>\n          <div class="donation-stat"><div class="k">입금·처리 완료</div><div class="v" id="donationPaidTotal">0원</div></div>\n        </div>\n        <div style="overflow-x:auto;">\n          <table class="to-cards" id="donationTable">\n            <thead><tr><th>이름</th><th>기수</th><th>후원금액</th><th>상태</th><th>입금여부</th><th>비고</th><th></th></tr></thead>\n            <tbody id="donationBody"></tbody>\n          </table>\n        </div>\n        <div class="empty-hint" id="donationEmpty" style="display:none;">등록된 현금 후원이 없습니다.</div>\n        <button class="add-row-btn lockable" id="addDonation">+ 후원 추가</button>\n      </div>\n    </div>\n  </section>\n\n'''
          if marker in s and 'id="body-donations"' not in s:
              s=s.replace(marker,donation_html+marker,1)

          # 3) state
          s=s.replace('''  sponsors: [],\n  production: [],''','''  sponsors: [],\n  donations: [],\n  production: [],''',1)

          # 4) remote init
          s=s.replace('''    participants: state.participants, waitlist: state.waitlist, sponsors: state.sponsors, production: state.production,''','''    participants: state.participants, waitlist: state.waitlist, sponsors: state.sponsors, donations: state.donations, production: state.production,''',1)

          # 5) load donations after sponsor migration block
          load_anchor='''  state.production = await dGet("production", DEFAULT_PROD.map(p => ({id:uid(), ...p})));'''
          load_insert='''  state.donations = await dGet("donations", []);\n  if(!Array.isArray(state.donations)) state.donations = [];\n  state.donations.forEach(d => {\n    if(d.generation === undefined) d.generation = "";\n    if(d.amount === undefined) d.amount = 0;\n    if(d.status === undefined) d.status = "의사표시";\n    if(d.paid === undefined) d.paid = false;\n    if(d.note === undefined) d.note = "";\n  });\n\n'''+load_anchor
          if load_anchor in s and 'state.donations = await dGet("donations"' not in s:
              s=s.replace(load_anchor,load_insert,1)

          # 6) render / interactions before sponsors
          render_marker='''// ---------- sponsors ----------'''
          render_code=r'''// ---------- cash donations ----------
const DONATION_STATUSES=["의사표시","확정","보류"];
function renderDonations(){
  const rows=Array.isArray(state.donations)?state.donations:[];
  const body=document.getElementById("donationBody");
  if(!body) return;
  body.innerHTML="";
  const empty=document.getElementById("donationEmpty");
  if(empty) empty.style.display=rows.length?"none":"block";
  let expected=0, paidTotal=0;
  rows.forEach(row=>{
    const amount=Math.max(0,Number(row.amount)||0);
    if(row.status!=="보류") expected+=amount;
    if(row.paid) paidTotal+=amount;
    const tr=document.createElement("tr");
    const statusOpts=DONATION_STATUSES.map(v=>`<option value="${v}" ${row.status===v?"selected":""}>${v}</option>`).join("");
    tr.innerHTML=`
      <td data-label="이름"><input class="lockable" type="text" value="${escapeHtml(row.name||"")}" data-field="name"></td>
      <td data-label="기수"><input class="lockable" type="text" value="${escapeHtml(row.generation||"")}" data-field="generation" placeholder="예: 2기"></td>
      <td data-label="후원금액"><input class="lockable" type="number" min="0" step="10000" value="${amount}" data-field="amount"></td>
      <td data-label="상태"><select class="lockable" data-field="status">${statusOpts}</select></td>
      <td data-label="입금여부"><select class="lockable" data-field="paid"><option value="false" ${!row.paid?"selected":""}>미입금</option><option value="true" ${row.paid?"selected":""}>입금완료</option></select></td>
      <td data-label="비고"><input class="lockable" type="text" value="${escapeHtml(row.note||"")}" data-field="note"></td>
      <td><button class="row-del lockable" title="삭제">✕</button></td>`;
    tr.querySelectorAll("[data-field]").forEach(el=>{
      el.addEventListener("change",async e=>{
        const f=e.target.dataset.field;
        if(f==="amount") row.amount=Math.max(0,Number(e.target.value)||0);
        else if(f==="paid") row.paid=e.target.value==="true";
        else row[f]=e.target.value;
        await dSet("donations",state.donations);
        renderDonations();
      });
    });
    tr.querySelector(".row-del").addEventListener("click",async()=>{
      if(!state.editMode) return;
      if(!await customConfirm(`"${row.name||"이 후원"}" 항목을 삭제할까요?`)) return;
      state.donations=state.donations.filter(x=>x.id!==row.id);
      await dSet("donations",state.donations);
      renderDonations();
    });
    body.appendChild(tr);
  });
  const e=document.getElementById("donationExpectedTotal"); if(e) e.textContent=money(expected);
  const p=document.getElementById("donationPaidTotal"); if(p) p.textContent=money(paidTotal);
  applyEditLock();
}
document.getElementById("addDonation")?.addEventListener("click",async()=>{
  if(!state.editMode) return;
  state.donations.push({id:uid(),name:"",generation:"",amount:0,status:"의사표시",paid:false,note:""});
  await dSet("donations",state.donations);
  renderDonations();
});

'''
          if render_marker in s and '// ---------- cash donations ----------' not in s:
              s=s.replace(render_marker,render_code+render_marker,1)

          # 7) renderAll
          s=s.replace('''  renderSponsors();\n  renderProduction();''','''  renderSponsors();\n  renderDonations();\n  renderProduction();''',1)

          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Separate cash donations from sponsorships"
          git push
