const map=L.map('map').setView([36.2,127.9],7);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);let marker;
const esc=s=>(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
async function locate(p){const query=p.addr||p.name+' 대한민국';const u='https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=kr&q='+encodeURIComponent(query);try{const r=await fetch(u,{headers:{'Accept':'application/json'}});const d=await r.json();if(!d.length){window.open('https://map.naver.com/p/search/'+encodeURIComponent(p.name),'_blank');return}const lat=+d[0].lat,lon=+d[0].lon;if(marker)map.removeLayer(marker);marker=L.marker([lat,lon]).addTo(map).bindPopup('<b>'+esc(p.name)+'</b><br>'+esc(p.owner+' '+p.gen)+'<br>'+esc(p.addr||'지도 검색 결과')).openPopup();map.setView([lat,lon],16)}catch(e){window.open('https://map.naver.com/p/search/'+encodeURIComponent(p.name),'_blank')}}
let filter='all';function render(){const q=document.getElementById('q').value.trim().toLowerCase();const arr=places.filter(p=>{const txt=[p.name,p.owner,p.gen,p.cat,p.region,p.addr].join(' ').toLowerCase();const okq=!q||txt.includes(q);const okf=filter==='all'||(filter==='verified'&&p.verified)||p.region===filter;return okq&&okf});const g=document.getElementById('grid');g.innerHTML=arr.map((p,i)=>`<div class="card"><div class="row"><div><div class="name">${esc(p.name)}</div><div class="owner">${esc([p.owner,p.gen,p.cat].filter(Boolean).join(' · '))}</div></div><span class="badge ${p.verified?'ok':''}">${p.verified?'주소 확인':'DB 등록'}</span></div><div class="addr">${esc(p.addr||'정확한 주소 확인 중')}</div><div class="actions"><button class="btn primary" onclick="locate(places[${places.indexOf(p)}])">지도에서 보기</button><a class="btn" target="_blank" rel="noopener" href="https://map.naver.com/p/search/${encodeURIComponent(p.name)}">네이버지도 검색</a></div></div>`).join('');document.getElementById('empty').style.display=arr.length?'none':'block'}
