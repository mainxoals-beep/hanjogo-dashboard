<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>한조고 동문 업장 지도</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.0"></script><style>
:root{--p:#6E5FCB;--pd:#4E43A0;--pl:#EEEDFB;--iv:#FAF8F4;--ink:#24211e;--sub:#706b64;--line:#e8e2d8}*{box-sizing:border-box}body{margin:0;background:var(--iv);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}.wrap{max-width:980px;margin:auto;padding:20px 15px 70px}.back{color:var(--pd);font-size:12px;font-weight:800;text-decoration:none}.head{margin:13px 0}.head h1{margin:5px 0 4px;font-size:25px}.head p{margin:0;color:var(--sub);font-size:12.5px}.eyebrow{font-size:10px;color:var(--pd);font-weight:900;letter-spacing:.12em}.auth,.map,.card{background:#fff;border:1px solid var(--line);border-radius:14px}.auth{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 12px;margin-bottom:10px;font-size:11px}.btn{border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--pd);padding:8px 10px;font-weight:900;text-decoration:none;font-size:10.5px;cursor:pointer}.primary{background:var(--p);border-color:var(--p);color:#fff}.tools{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}.tools input{flex:1;min-width:180px;border:1px solid var(--line);border-radius:10px;padding:10px}.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 10px;font-size:10px;font-weight:800;color:var(--sub)}.chip.on{background:var(--p);color:#fff}.map{height:470px;position:relative;overflow:hidden;background:#e9edf0}.map iframe{width:100%;height:100%;border:0}.mapmsg{position:absolute;left:10px;bottom:10px;background:#fffffff2;border:1px solid var(--line);padding:7px 9px;border-radius:9px;font-size:9.5px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:10px}.card{padding:12px}.row{display:flex;justify-content:space-between;gap:7px}.name{font-size:14px;font-weight:900}.badge{background:var(--pl);color:var(--pd);border-radius:999px;padding:3px 7px;font-size:9px;font-weight:900}.owner,.addr,.desc{margin-top:4px;font-size:11px;color: </style></head><body><div class="wrap"><a class="back" href="schedule.html">← 한조고 네트워크 홈</a><div class="head"><div class="eyebrow">HANJOGO ALUMNI PLACES</div><h1>동문 업장 지도</h1><p>한조고 졸업생이 직접 운영하는 업장을 한 화면에서 찾아보세요.</p></div><div class="auth"><span id="authText">운영 동문은 이메일 인증 후 직접 정보를 관리할 수 있습니다.</span><div><button class="btn primary" id="registerBtn">+ 내 업장 등록</button> <button class="btn" id="authBtn">이메일 인증</button></div></div><div class="tools"><input id="q" placeholder="업장명 · 동문 · 기수 · 지역 검색"><button class="chip on" data-filter="all">전체</button><button class="chip" data-filter="서울">서울</button><button class="chip" data-filter="경기">경기</button><button class="chip" data-filter="지방">지방</button><button class="chip" data-filter="해외">해외</button></div><div class="map"><iframe id="mapFrame" title="동문 업장 지도" loading="lazy"></iframe><div class="mapmsg">업장 카드를 누르면 이 지도 안에서 바로 위치를 확인합니다.</div></div><div class="grid" id="grid"></div></div>
<dialog id="loginDialog"><h2>이메일 인증</h2><div class="form"><label>이메일<input id="loginEmail" type="email"></label></div><div class="modalActions"><button class="btn" onclick="loginDialog.close()">취소</button><button class="btn primary" id="sendMagic">인증메일 보내기</button></div></dialog><dialog id="registerDialog"><h2>내 업장 등록하기</h2><p>확인 후 지도에 공개됩니다.</p><div class="form"><div class="two"><label>이름<input id="rOwner"></label><label>기수<input id="rGen" type="number"></label></div><label>업장명<input id="rName"></label><div class="two"><label>업종<input id="rCategory"></label><label>지역<select id="rRegion"><option>서울</option><option>경기</option><option>지방</option><option>해외</option></select></label></div><label>주소<input id="rAddress"></label><label>Instagram<input id="rInstagram"></label><label>홈페이지<input id="rWebsite"></label><label>예약 링크<input id="rBooking"></label><label>한줄 소개<textarea id="rDescription"></textarea></label></div><div class="modalActions"><button class="btn" onclick="registerDialog.close()">취소</button><button class="btn primary" id="submitPlace">등록 신청</button></div></dialog>
<script>const U='https://siuresrjvrrezhwsjery.supabase.co',K='sb_publishable_wUyHlifthoh02pevGvIjYA_IBRw5Phs',sb=supabase.createClient(U,K);let places=[],session=null,filter='all';const $=x=>document.getElementById(x),esc=s=>String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function map(q){$('mapFrame').src='https://www.google.com/maps?q='+encodeURIComponent(q||'대한민국')+'&output=embed'}function draw(){let q=$('q').value.trim().toLowerCase(),v=places.filter(p=>(filter==='all'||p.region===filter)&&(!q||[p.name,p.owner_name,p.generation,p.region,p.address,p.category].join(' ').toLowerCase().includes(q)));$('grid').innerHTML=v.map(p=>`<div class="card"><div class="row"><div class="name">${esc(p.name)}</div><span class="badge">${esc(p.category||'업장')}</span></div><div class="owner">${p.generation?esc(p.generation)+'기 · ':''}${esc(p.owner_name||'')}</div><div class="addr">${esc(p.address||'주소 확인 중')}</div>${p.description?`<div class="desc">${esc(p.description)}</div>`:''}<div class="actions"><button class="btn primary" onclick='map(${JSON.stringify(p.address||p.name)})'>이 화면에서 지도 보기</button>${p.instagram?`<a class="btn" href="${esc(p.instagram)}" target="_blank">Instagram</a>`:''}</div></div>`).join('');if(v[0])map(v[0].address||v[0].name);else map('대한민국')}async function load(){let r=await sb.from('alumni_places').select('*').eq('is_public',true).order('name');places=r.data||[];draw()}$('q').oninput=draw;document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{document.querySelectorAll('.chip').forEach(x=>x.classList.remove('on'));b.classList.add('on');filter=b.dataset.filter;draw()});$('authBtn').onclick=()=>session?sb.auth.signOut().then(()=>location.reload()):loginDialog.showModal();$('sendMagic').onclick=async()=>{let e=$('loginEmail').value.trim();if(!e)return alert('이메일을 입력해주세요.');let r=await sb.auth.signInWithOtp({email:e,options:{emailRedirectTo:location.href}});alert(r.error?r.error.message:'인증메일을 보냈습니다.');if(!r.error)loginDialog.close()};$('registerBtn').onclick=()=>session?registerDialog.showModal():loginDialog.showModal();$('submitPlace').onclick=async()=>{let x={owner_email:session.user.email,owner_name:$('rOwner').value.trim(),generation:+$('rGen').value||null,name:$('rName').value.trim(),category:$('rCategory').value.trim(),region:$('rRegion').value,address:$('rAddress').value.trim(),instagram:$('rInstagram').value.trim(),website:$('rWebsite').value.trim(),booking_url:$('rBooking').value.trim(),description:$('rDescription').value.trim()};if(!x.owner_name||!x.name)return alert('이름과 업장명을 입력해주세요.');let r=await sb.from('alumni_place_requests').insert(x);if(r.error)return alert(r.error.message);alert('등록 신청이 완료되었습니다.');registerDialog.close()};(async()=>{session=(await sb.auth.getSession()).data.session;$('authText').textContent=session?session.user.email+' 인증됨 · 업장 정보를 등록할 수 있습니다.':'운영 동문은 이메일 인증 후 직접 정보를 관리할 수 있습니다.';$('authBtn').textContent=session?'로그아웃':'이메일 인증';load()})();</script></body></html>
