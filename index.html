<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>한조고 동문 네트워크 모임 · 준비 대시보드</title>
<style>
  :root{
    --purple:#6E5FCB;
    --purple-dark:#4E43A0;
    --purple-light:#EEEDFB;
    --ivory:#FAF8F4;
    --ink:#1E1C1A;
    --ink-sub:#6B6862;
    --ink-mute:#9C988F;
    --line:#E7E3D9;
    --card:#FFFFFF;
    --ok:#4B9463;
    --ok-bg:#E9F3EC;
    --warn:#B8873A;
    --warn-bg:#FBF1DF;
    --danger:#B05A42;
    --danger-bg:#F8EAE5;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;background:var(--ivory);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
    line-height:1.5;font-size:14px;
  }
  .wrap{max-width:960px;margin:0 auto;padding:28px 18px 90px;}
  button, input, select{font-family:inherit;}
  :focus-visible{outline:2px solid var(--purple);outline-offset:1px;}

  /* view-only lock */
  body.view-only .lockable{opacity:0.6;cursor:not-allowed;}

  /* ---------- header ---------- */
  .header-top{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:12px;margin-bottom:20px;}
  .eyebrow{font-size:12px;letter-spacing:0.06em;color:var(--purple-dark);font-weight:700;text-transform:uppercase;margin:0 0 6px;}
  h1{font-size:23px;font-weight:700;margin:0 0 4px;letter-spacing:-0.01em;}
  .subline{font-size:13px;color:var(--ink-sub);margin:0;}

  .mode-wrap{display:flex;align-items:center;gap:8px;padding-top:2px;flex-wrap:wrap;}
  .mode-label{font-size:12px;color:var(--ink-sub);font-weight:600;}
  .switch{position:relative;display:inline-block;width:36px;height:21px;flex-shrink:0;}
  .switch input{opacity:0;width:0;height:0;}
  .switch-track{position:absolute;cursor:pointer;inset:0;background:var(--line);border-radius:22px;transition:.2s;}
  .switch-track::before{content:"";position:absolute;height:15px;width:15px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s;box-shadow:0 1px 2px rgba(0,0,0,0.2);}
  .switch input:checked + .switch-track{background:var(--purple);}
  .switch input:checked + .switch-track::before{transform:translateX(15px);}

  .view-banner{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    background:var(--warn-bg);border:1px solid #EBD9AF;border-radius:12px;padding:9px 14px;margin-bottom:16px;
  }
  .view-banner-text{font-size:12.5px;color:#8C6A28;font-weight:600;}
  .edit-btn{background:var(--purple);color:#fff;border:none;border-radius:8px;padding:7px 14px;font-size:12.5px;font-weight:700;cursor:pointer;}
  .edit-btn:hover{background:var(--purple-dark);}

  /* ---------- hero ---------- */
  .hero{
    display:flex;align-items:center;gap:24px;
    background:linear-gradient(135deg,var(--purple) 0%,var(--purple-dark) 100%);
    color:#fff;border-radius:18px;padding:22px 26px;margin-bottom:16px;flex-wrap:wrap;
  }
  .hero .dday{font-size:44px;font-weight:800;letter-spacing:-0.02em;line-height:1;}
  .hero .ddate{font-size:12.5px;opacity:0.85;margin-top:6px;}
  .hero .divider{width:1px;align-self:stretch;background:rgba(255,255,255,0.25);min-height:40px;}
  .hero .prog{flex:1;min-width:180px;}
  .hero .prog-label{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:8px;opacity:0.92;}
  .hero .bar{height:8px;border-radius:6px;background:rgba(255,255,255,0.25);overflow:hidden;}
  .hero .bar-fill{height:100%;background:#fff;border-radius:6px;transition:width .3s;}

  /* ---------- action items (지금 확인할 것) ---------- */
  .action-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:6px;margin-bottom:24px;}
  .action-head{padding:12px 14px 4px;font-size:14.5px;font-weight:700;}
  .action-empty{padding:16px;text-align:center;color:var(--ink-mute);font-size:13px;}
  .action-row{display:flex;align-items:flex-start;gap:10px;padding:9px 14px;border-top:1px solid var(--line);}
  .action-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;margin-top:5px;}
  .action-dot.late{background:var(--danger);}
  .action-dot.soon{background:var(--warn);}
  .action-dot.info{background:var(--purple);}
