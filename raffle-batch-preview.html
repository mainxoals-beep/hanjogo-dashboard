<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>추첨 진행 화면</title><link rel="stylesheet" href="assets/raffle-batch.css"><style>body{margin:0;background:#19112e;color:white;font-family:system-ui,sans-serif}#raffleLivePanel{padding:24px;text-align:center}h2{font-size:23px;line-height:1.5}#raffleLiveFoot{color:#d4c5ed;line-height:1.6}.badge{font-size:14px;color:#ffe395}</style></head><body><div id="raffleLivePanel"><p class="badge" id="previewLabel"></p><h2 id="prize"></h2><div id="raffleLiveName"></div><p id="raffleLiveFoot"></p></div><script src="assets/raffle-batch.js"></script><script>
let live,stop;
window.addEventListener('message',event=>{
 if(event.source!==parent||event.data?.type!=='raffle-batch-preview')return;
 live=event.data.live;if(!live?.batch||!Array.isArray(live.winners))return;
 document.getElementById('previewLabel').textContent=event.data.test?'내부 테스트 · 실제 당첨 아님':'실제 추첨 · 외부 화면과 동시 공개';
 document.getElementById('prize').textContent=live.prize;
 if(!stop)stop=HanjogoBatch.mount(document,()=>live);
 parent.postMessage({type:'raffle-test-audio',action:'batch',live},'*');
});
parent.postMessage({type:'raffle-batch-ready'},'*');
</script></body></html>
