<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>추첨 진행 화면</title><link rel="stylesheet" href="assets/raffle-presentation.css?v=20261011-fx3"><link rel="stylesheet" href="assets/raffle-batch.css?v=20261011-fx3"><style>body{margin:0;font-family:Arial,"Noto Sans KR",sans-serif}*{box-sizing:border-box}</style></head><body><div class="raffle-live-overlay" id="raffleLiveOverlay" aria-hidden="false">

  <div class="raffle-confetti" id="raffleConfetti" aria-hidden="true"></div>
  <div class="raffle-live-panel" id="raffleLivePanel" role="dialog" aria-modal="true" aria-labelledby="raffleLivePrize">
    <div class="raffle-live-kicker" id="raffleLiveKicker">HANJOGO LIVE RAFFLE</div>
    <div class="raffle-live-prize" id="raffleLivePrize">현장 경품 추첨</div>
    <div class="raffle-live-pool" id="raffleLivePool">추첨 대기 중</div>
    <div class="raffle-live-name" id="raffleLiveName">10월 18일 현장에서 만나요</div>
    <div class="raffle-live-foot" id="raffleLiveFoot">모든 화면에 같은 결과가 표시됩니다.</div>
  </div>
</div>
<script src="assets/raffle-batch.js?v=20261011-fx3"></script><script>
let live,stop;
function setPrize(value){
 const el=document.getElementById('raffleLivePrize');el.replaceChildren();const parts=String(value).split(' · ');
 if(parts.length>1){const sponsor=document.createElement('span');sponsor.className='raffle-prize-sponsor';sponsor.textContent=parts.shift();el.append(sponsor);}
 const title=document.createElement('span');title.textContent=parts.join(' · ');el.append(title);
}
window.addEventListener('message',event=>{
 if(event.source!==parent||event.data?.type!=='raffle-batch-preview')return;
 live=event.data.live;if(!live?.winner&&!(live?.batch&&Array.isArray(live.winners)))return;
 document.getElementById('raffleLiveKicker').textContent=event.data.test?'TEST PREVIEW · 실제 당첨 아님':'HANJOGO LIVE RAFFLE';
 document.getElementById('raffleLivePool').textContent=live.poolLabel||'전체 참여자';
 setPrize(live.prize);if(!stop)stop=HanjogoBatch.mount(document,()=>live);
 parent.postMessage({type:'raffle-test-audio',action:'batch',live},'*');
});
parent.postMessage({type:'raffle-batch-ready'},'*');
</script></body></html>
